services:
  be:
    build: .
    container_name: memome-be
    restart: always
    ports:
      - 8080:8080
    networks:
      - db-net
      - redis-net
    env_file:
      - .env
  db:
    image: mysql:8.4-oracle
    restart: always
    container_name: memome-db
    networks:
      - db-net
    volumes:
      - memome-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: memome
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
  redis:
    image: redis:8.10-trixie
    container_name: memome-redis
    restart: always
    networks:
      - redis-net
volumes:
  memome-data:
    name: memome-data
networks:
  db-net:
    driver: bridge
  redis-net:
    driver: bridge
#  //.env 파일 엮어야 함.